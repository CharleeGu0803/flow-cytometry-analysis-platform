{% extends "base.htm" %}

{% block page_title %}User Management{% endblock %}

{% block breadcrumb %}<span>Admin</span><i class="fas fa-chevron-right sep"></i><span class="current">User Management</span>{% endblock %}

{% block page_body %}
<div class="page-header">
    <div>
        <h1>User Management</h1>
        <p id="user-summary">Loading users…</p>
    </div>
</div>

<div class="card">
    <div class="table-wrap">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Role</th>
                    <th class="num">Datasets</th>
                    <th class="num">Files</th>
                    <th>Created</th>
                    <th class="actions"><span class="visually-hidden">Actions</span></th>
                </tr>
            </thead>
            <tbody id="user-rows"></tbody>
        </table>
    </div>
</div>

<script>
let users = [];

function renderUsers() {
    const admins = users.filter(u => u.is_admin).length;
    document.getElementById('user-summary').textContent =
        plural(users.length, 'user') + ' · ' + plural(admins, 'administrator');
    document.getElementById('user-rows').innerHTML = users.map(u => `
        <tr>
            <td>${escapeHtml(u.username)} ${u.is_self ? '<span class="badge">You</span>' : ''}</td>
            <td>${u.is_admin ? '<span class="badge badge-primary">Admin</span>' : '<span class="badge">User</span>'}</td>
            <td class="num">${u.dataset_count.toLocaleString()}</td>
            <td class="num">${u.file_count.toLocaleString()}</td>
            <td class="muted"><time data-local datetime="${escapeHtml(u.created_at)}"></time></td>
            <td class="actions">
                <a href="/admin/files?user_id=${u.user_id}" class="btn btn-secondary btn-sm">View files</a>
                <button class="btn btn-secondary btn-sm" onclick="resetPassword(${u.user_id})">Reset password</button>
                ${u.is_self
                    ? '<button class="btn btn-danger-ghost btn-sm" disabled title="You cannot delete your own account"><i class="fas fa-trash-can"></i> Delete</button>'
                    : `<button class="btn btn-danger-ghost btn-sm" onclick="deleteUser(${u.user_id})"><i class="fas fa-trash-can"></i> Delete</button>`}
            </td>
        </tr>`).join('');
    localizeTimes(document.getElementById('user-rows'));
}

async function fetchUsers() {
    try {
        users = (await api('/api/admin/users')).users;
        renderUsers();
    } catch (err) {
        document.getElementById('user-summary').textContent = 'Could not load users: ' + err.message;
    }
}

async function deleteUser(userId) {
    const u = users.find(x => x.user_id === userId);
    const ok = await confirmDialog({
        title: `Delete user “${u.username}”?`,
        message: `This permanently deletes the account, ${plural(u.dataset_count, 'dataset')} and ${plural(u.file_count, 'file')}. This cannot be undone.`,
        confirmText: 'Delete user', danger: true,
    });
    if (!ok) return;
    try {
        const data = await api('/api/admin/delete_user', {method: 'POST', form: {user_id: userId}});
        showToast(data.message);
        fetchUsers();
    } catch (err) {
        showToast(err.message, 'error');
    }
}

async function resetPassword(userId) {
    const u = users.find(x => x.user_id === userId);
    const password = await promptDialog({
        title: `Reset password for “${u.username}”`,
        message: 'Share the new password with the user through a secure channel.',
        confirmText: 'Reset password',
        input: {label: 'New password', type: 'password', minLength: 6, placeholder: 'At least 6 characters'},
    });
    if (!password) return;
    try {
        const data = await api('/api/admin/reset_password', {method: 'POST', form: {user_id: userId, password}});
        showToast(data.message);
    } catch (err) {
        showToast(err.message, 'error');
    }
}

fetchUsers();
</script>
{% endblock %}
