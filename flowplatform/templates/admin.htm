{% extends "base.htm" %}

{% block page_title %}Admin - User Management{% endblock %}

{% block page_body %}
<h1><i class="fas fa-user-shield"></i> Admin - User Management Page</h1>

<div id="userTable" style="margin-top: 30px;">Loading...</div>

<style>
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        font-family: Arial, sans-serif;
    }
    th, td {
        text-align: center;
        padding: 12px;
        border: 1px solid #ddd;
        color: black; /* 表格文字黑色 */
    }
    tr:hover {
        background-color: #f9f9f9; /* 鼠标悬浮浅灰色 */
    }
    th {
        background-color: transparent; /* 表头透明 */
        color: black; /* 表头文字黑色 */
        font-weight: bold;
    }
    button {
        padding: 5px 12px;
        margin: 2px;
        border: 1px solid black; /* 按钮边框黑色 */
        background-color: transparent; /* 按钮背景透明 */
        color: black; /* 按钮文字黑色 */
        cursor: pointer;
        border-radius: 6px;
        transition: all 0.3s ease;
        font-size: 14px;
    }
    button:hover {
        background-color: black; /* 鼠标悬停按钮背景变黑 */
        color: white; /* 鼠标悬停按钮文字变白 */
    }
</style>




<script>
function fetchUsers() {
    fetch('/api/admin/users', {
        headers: {
            'Authorization': localStorage.getItem('authToken')
        }
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            // 按 username 排序
            data.users.sort((a, b) => a.username.localeCompare(b.username));

            let html = '<table>'
                     + '<thead><tr><th>Username</th><th>File Count</th><th>Operations</th></tr></thead><tbody>';
            data.users.forEach(u => {
                html += `<tr>
                            <td>${u.username}</td>
                            <td>${u.files.length}</td>
                            <td>
                                <button onclick="deleteUser(${u.user_id})">Delete</button>
                                <button onclick="viewFiles(${u.user_id})">View Files</button>
                            </td>
                         </tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('userTable').innerHTML = html;
        } else {
            alert(data.message);
        }
    });
}

function deleteUser(userId) {
    if (!confirm('Are you sure you want to delete this user and all associated files?')) return;
    const formData = new FormData();
    formData.append('user_id', userId);
    fetch('/api/admin/delete_user', {
        method: 'POST',
        headers: {
            'Authorization': localStorage.getItem('authToken')
        },
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        if (data.success) fetchUsers();
    });
}

function viewFiles(userId) {
    window.location.href = `/admin/files?user_id=${userId}`;
}

document.addEventListener('DOMContentLoaded', fetchUsers);
</script>

{% endblock %}
