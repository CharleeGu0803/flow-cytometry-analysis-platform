{% extends "base.htm" %}

{% block page_title %}Datasets{% endblock %}

{% block breadcrumb %}<span class="current">Datasets</span>{% endblock %}

{% block page_body %}
<div class="page-header">
    <div>
        <h1>Datasets</h1>
        <p>Each dataset holds batches of FCS samples. Open a batch to see and analyze its samples.</p>
    </div>
    <div class="page-actions">
        <button id="add-dataset-btn" class="btn btn-primary">
            <i class="fas fa-plus"></i> New dataset
        </button>
    </div>
</div>

<div class="datasets-grid" id="datasets-grid">
    <div class="card empty-state"><p>Loading datasets…</p></div>
</div>

<style>
.datasets-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr));
    gap: 20px;
    align-items: start;
}

.datasets-grid > .empty-state {
    grid-column: 1 / -1;
}

.dataset-card {
    padding: 0;
}

.dataset-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 16px 16px 20px;
    border-bottom: 1px solid var(--border);
}

.dataset-icon {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 8px;
    background: var(--primary-soft);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
}

.dataset-title {
    flex: 1;
    min-width: 0;
}

.dataset-title h3 {
    overflow-wrap: anywhere;
}

.dataset-title small {
    color: var(--text-muted);
    font-size: 14px;
}

.batch-list {
    list-style: none;
    margin: 0;
    padding: 8px;
}

.batch-row {
    display: flex;
    align-items: center;
    gap: 4px;
    border-radius: 6px;
}

.batch-row:hover {
    background: var(--bg);
}

.batch-link {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    color: var(--text);
    border-radius: 6px;
}

.batch-link:hover {
    color: var(--text);
    text-decoration: none;
}

.batch-link:hover .batch-name {
    color: var(--primary);
}

.batch-link > i {
    color: var(--text-muted);
}

.batch-name {
    flex: 1;
    min-width: 0;
    font-weight: 500;
    overflow-wrap: anywhere;
}

.batch-link small {
    color: var(--text-muted);
    font-size: 14px;
    white-space: nowrap;
}

.batch-link .fa-chevron-right {
    font-size: 12px;
}

.batch-row .icon-btn {
    margin-right: 4px;
}

.batch-empty {
    padding: 12px;
    color: var(--text-muted);
    font-size: 15px;
}

.dataset-footer {
    padding: 0 16px 16px;
}
</style>

<script>
const grid = document.getElementById('datasets-grid');
let datasets = [];

function sampleCount(dataset) {
    return dataset.batches.reduce((sum, b) => sum + b.samples, 0);
}

function renderDatasets() {
    if (datasets.length === 0) {
        grid.innerHTML = `
            <div class="card empty-state">
                <i class="fas fa-folder-open"></i>
                <p>You don't have any datasets yet.</p>
                <button class="btn btn-primary" onclick="createDataset()"><i class="fas fa-plus"></i> New dataset</button>
            </div>`;
        return;
    }
    grid.innerHTML = datasets.map(d => `
        <div class="card dataset-card">
            <div class="dataset-header">
                <div class="dataset-icon"><i class="fas fa-folder"></i></div>
                <div class="dataset-title">
                    <h3>${escapeHtml(d.dataset_name)}</h3>
                    <small>${plural(d.batches.length, 'batch', 'batches')} · ${plural(sampleCount(d), 'sample')}</small>
                </div>
                <button class="icon-btn danger" onclick="deleteDataset(${d.dataset_id})"
                        title="Delete dataset" aria-label="Delete dataset ${escapeHtml(d.dataset_name)}">
                    <i class="fas fa-trash-can"></i>
                </button>
            </div>
            <ul class="batch-list">
                ${d.batches.length ? d.batches.map(b => `
                <li class="batch-row">
                    <a href="/batch?batch_id=${b.batch_id}" class="batch-link">
                        <i class="fas fa-layer-group"></i>
                        <span class="batch-name">${escapeHtml(b.batch_name)}</span>
                        <small>${plural(b.samples, 'sample')}</small>
                        <i class="fas fa-chevron-right"></i>
                    </a>
                    <button class="icon-btn danger" onclick="deleteBatch(${d.dataset_id}, ${b.batch_id})"
                            title="Delete batch" aria-label="Delete batch ${escapeHtml(b.batch_name)}">
                        <i class="fas fa-trash-can"></i>
                    </button>
                </li>`).join('') : '<li class="batch-empty">No batches yet.</li>'}
            </ul>
            <div class="dataset-footer">
                <button class="btn btn-secondary btn-sm" onclick="createBatch(${d.dataset_id})">
                    <i class="fas fa-plus"></i> Add batch
                </button>
            </div>
        </div>`).join('');
}

async function loadDatasets() {
    try {
        datasets = (await api('/api/datasets?timestamp=' + Date.now())).datasets;
        renderDatasets();
    } catch (err) {
        grid.innerHTML = `<div class="card empty-state"><p>Could not load datasets: ${escapeHtml(err.message)}</p></div>`;
    }
}

async function run(action, successMessage) {
    try {
        await action();
        showToast(successMessage);
        await loadDatasets();
    } catch (err) {
        showToast(err.message, 'error');
    }
}

async function createDataset() {
    const name = await promptDialog({
        title: 'New dataset', confirmText: 'Create dataset',
        input: {label: 'Dataset name', placeholder: 'e.g. COVID T-cell panel'},
    });
    if (name) run(() => api('/api/dataset/new', {method: 'POST', form: {dataset_name: name}}), `Created dataset “${name}”`);
}

async function createBatch(datasetId) {
    const dataset = datasets.find(d => d.dataset_id === datasetId);
    const name = await promptDialog({
        title: 'Add batch', message: `The batch will be added to “${dataset.dataset_name}”.`, confirmText: 'Add batch',
        input: {label: 'Batch name', placeholder: 'e.g. Plate 1'},
    });
    if (name) run(() => api('/api/batch/new', {method: 'POST', form: {dataset_id: datasetId, batch_name: name}}),
        `Added batch “${name}”`);
}

async function deleteDataset(datasetId) {
    const d = datasets.find(x => x.dataset_id === datasetId);
    const ok = await confirmDialog({
        title: `Delete “${d.dataset_name}”?`,
        message: `This permanently deletes ${plural(d.batches.length, 'batch', 'batches')} and ${plural(sampleCount(d), 'sample')}. This cannot be undone.`,
        confirmText: 'Delete dataset', danger: true,
    });
    if (ok) run(() => api('/api/dataset/delete', {method: 'POST', form: {dataset_id: datasetId}}),
        `Deleted dataset “${d.dataset_name}”`);
}

async function deleteBatch(datasetId, batchId) {
    const b = datasets.find(x => x.dataset_id === datasetId).batches.find(x => x.batch_id === batchId);
    const ok = await confirmDialog({
        title: `Delete “${b.batch_name}”?`,
        message: `This permanently deletes the batch and its ${plural(b.samples, 'sample')}. This cannot be undone.`,
        confirmText: 'Delete batch', danger: true,
    });
    if (ok) run(() => api('/api/batch/delete', {method: 'POST', form: {batch_id: batchId}}),
        `Deleted batch “${b.batch_name}”`);
}

document.getElementById('add-dataset-btn').addEventListener('click', createDataset);
loadDatasets();
</script>
{% endblock %}
