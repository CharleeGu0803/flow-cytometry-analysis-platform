{% extends "base.htm" %}

{% block page_title %}Create account{% endblock %}

{% block page_body %}
<div class="auth-wrapper">
    <div class="brand">
        <i class="fas fa-microscope"></i>
        <span>Flow Cytometry Platform</span>
    </div>

    <div class="card auth-card">
        <h1>Create your account</h1>

        <div class="alert alert-error" id="register-error" role="alert" hidden>
            <i class="fas fa-circle-exclamation"></i>
            <span></span>
        </div>

        <form method="POST" action="/register" id="registerForm" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control"
                       autocomplete="username" autofocus required>
                <div class="form-hint">3–50 characters: letters, digits, “.”, “_” or “-”.</div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" class="form-control"
                           autocomplete="new-password" required>
                    <button type="button" class="icon-btn" onclick="togglePassword(this)" aria-label="Show password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="form-hint">At least 6 characters.</div>
            </div>
            <button class="btn btn-primary btn-block" type="submit" id="register-btn">Create account</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="/login">Log in</a></p>
    </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async function (event) {
    event.preventDefault();
    const error = document.getElementById('register-error');
    const button = document.getElementById('register-btn');
    error.hidden = true;
    button.disabled = true;
    try {
        const data = await api('/register', {
            method: 'POST',
            form: {username: this.username.value.trim(), password: this.password.value},
        });
        window.location.href = data.redirect;
    } catch (err) {
        error.querySelector('span').textContent = err.message;
        error.hidden = false;
        button.disabled = false;
    }
});
</script>
{% endblock %}
